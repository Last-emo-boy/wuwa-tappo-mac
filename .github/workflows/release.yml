name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.1-mac.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WuwaTappo-*-Mac-arm64
          merge-multiple: true
          path: dist
      - name: Publish complete CN and Global Mac packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mac\.[0-9]+$ ]]
          for REGION in CN Global; do
            for EXT in zip dmg; do
              PACKAGES=(dist/WuwaTappo-"$REGION"-Mac-*-arm64."$EXT")
              [[ ${#PACKAGES[@]} -eq 1 && -f "${PACKAGES[0]}" ]]
            done
          done
          cat > /tmp/release-notes.md <<'NOTES'
          ## Wuwa Tappo · macOS 非官方重建版（国服 / 国际服）

          国服下载名称含 `CN` 的文件，国际服下载名称含 `Global` 的文件；两服应用、账号缓存和点击记录相互独立，可同时安装。

          下载 DMG 后将应用拖入“应用程序”，或解压 ZIP 后移动应用。两服安装包都包含各自官方界面、图像及运行资源，不需要 Windows、Wine 或手动提取 EXE。登录和联机仍需要连接对应地区的官方服务。

          - 支持 Apple Silicon，macOS 13 及以上。
          - 首次启动请按提示授权“输入监控”，用于按键和点击计数。
          - 当前使用临时签名，未进行 Apple 公证。系统可能要求在“隐私与安全性”中确认打开。
          - 包内不包含任何人的账号、登录凭据、点击记录或系统缓存。
          - 本项目由社区维护，不是库洛官方 Mac 客户端。随包的官方资源归原权利人所有；官方规则、账号和资产仍由官方服务决定。

          每服 ZIP 与 DMG 内容相同，共四个安装文件。只有两服自动化测试、原生构建和完整打包都成功后才发布；真人登录、系统权限及双人联机仍需实际验证。
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg --verify-tag --title "Wuwa Tappo Mac 国服 / 国际服 $TAG" --notes-file /tmp/release-notes.md --latest
          fi
